<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyOCR PDF preview</title>
    <style>
      html, body, #pdf-viewer {
        width: 100%;
        height: 100%;
        min-height: 700px;
        margin: 0;
      }
      body { overflow: hidden; background: #172554; }
      #viewer-error { padding: 1rem; color: #fecaca; font: 14px sans-serif; }
    </style>
  </head>
  <body>
    <div id="pdf-viewer"></div>
    <div id="viewer-error" role="alert" hidden></div>
    <script type="module">
      import EmbedPDF from "https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2/dist/embedpdf.js";

      const payload = window.__MYOCR_PDF__;
      const viewerTarget = document.getElementById("pdf-viewer");
      const errorTarget = document.getElementById("viewer-error");

      function showError(message) {
        errorTarget.textContent = message;
        errorTarget.hidden = false;
      }

      if (!payload || !payload.data) {
        showError("ไม่พบไฟล์ PDF สำหรับแสดงตัวอย่าง");
      } else {
        try {
          const binary = atob(payload.data);
          const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
          const blob = new Blob([bytes], {type: "application/pdf"});
          const pdfUrl = URL.createObjectURL(blob);
          EmbedPDF.init({type: "container", target: viewerTarget, src: pdfUrl});
        } catch (error) {
          showError(`เปิดตัวอย่าง PDF ไม่สำเร็จ: ${error.message}`);
        }
      }
    </script>
  </body>
</html>
